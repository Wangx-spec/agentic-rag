server:
  port: 8081

spring:
  application:
    name: agentic-rag
  datasource:
    url: jdbc:postgresql://localhost:5432/agentic_rag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
 
rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 10
  final-top-n: 5
  rrf-k: 60
  embedding-dim: ${RAG_EMBEDDING_DIM:1024} # 与 embedding-model 一致：bge-m3=1024，text-embedding-3-small=1536
  data-dir: ./data
  vector:
    type: qdrant
    qdrant:
      host: localhost
      port: 6334
      collection: agentic_rag_chunks

# LLM 配置（OpenAI 兼容接口）
# API Key 用环境变量注入：export LLM_API_KEY=sk-xxx
llm:
  base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${LLM_API_KEY:}
  chat-model: ${LLM_CHAT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
  embedding-model: ${LLM_EMBEDDING_MODEL:BAAI/bge-m3}
  timeout-seconds: 60
  max-agent-rounds: 5
  memory-rounds: 10

logging:
  level:
    com.agenticrag: info
