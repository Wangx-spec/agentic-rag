spring:
  datasource:
    url: jdbc:h2:mem:agentic_rag_eval;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init-h2.sql

rag:
  data-dir: ./target/eval-data
  vector:
    type: memory
  memory:
    type: memory
  chunk-size: 500
  chunk-overlap: 50
  min-chunk-size: 80

eval:
  llm-judge: false
  report-path: ./eval-report.md
