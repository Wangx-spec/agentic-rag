server:
  port: 8081

spring:
  application:
    name: agentic-rag
  datasource:
    url: jdbc:postgresql://localhost:5432/agentic_rag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql


rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 10
  final-top-n: 5
  rrf-k: 60
  embedding-dim: ${RAG_EMBEDDING_DIM:4096}
  data-dir: ./data
  min-chunk-size: 80
  memory:
    type: ${RAG_MEMORY_TYPE:memory}
  intent:
    enabled: ${RAG_INTENT_ENABLED:true}
    base-url: ${RAG_INTENT_BASE_URL:}
    model: ${RAG_INTENT_MODEL:}
    api-key: ${RAG_INTENT_API_KEY:}
    timeout-seconds: ${RAG_INTENT_TIMEOUT_SECONDS:5}
    confidence-threshold: ${RAG_INTENT_CONFIDENCE_THRESHOLD:0.6}
  vector:
    type: qdrant
    qdrant:
      host: localhost
      port: 6334
      collection-prefix: agentic_rag_chunks
      hnsw-m: 16
      ef-construct: 100
      search-ef: 100

# LLM 配置（OpenAI 兼容接口）
# API Key 必须通过环境变量注入，禁止在仓库中保存真实密钥
llm:
  base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${LLM_API_KEY}
  chat-model: ${LLM_CHAT_MODEL:zai-org/GLM-5.3}
  embedding-model: ${LLM_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
  timeout-seconds: 60
  max-agent-rounds: 5
  memory-rounds: 10


mcp:
  enabled: ${MCP_ENABLED:false}
  server:
    url: ${MCP_SERVER_URL:}
    stdio:
      command: ${MCP_STDIO_COMMAND:}
      args: ${MCP_STDIO_ARGS:}

logging:
  level:
    com.agenticrag: info
