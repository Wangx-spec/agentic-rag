server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: agentic-rag
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentic_rag}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql


rag:
  chunk-size: 500
  chunk-overlap: 50
  top-k: 10
  final-top-n: 5
  rrf-k: 60
  retrieval:
    mode: ${RAG_RETRIEVAL_MODE:hybrid}   # hybrid | bm25 | vector，通道消融评测开关
    rewriter-enabled: ${RAG_RETRIEVAL_REWRITER_ENABLED:false}       # Phase 3.1：LLM 查询改写（多查询并行检索）
    rewriter-min-tokens: ${RAG_RETRIEVAL_REWRITER_MIN_TOKENS:15}    # 短查询不触发改写
    hyde-enabled: ${RAG_RETRIEVAL_HYDE_ENABLED:false}               # Phase 3.2：HyDE 假设性答案检索
    rerank:
      enabled: ${RAG_RETRIEVAL_RERANK_ENABLED:false}                 # Phase 7：Rerank 精排总开关
      model: ${RAG_RETRIEVAL_RERANK_MODEL:BAAI/bge-reranker-v2-m3}  # 硅基流动 rerank 模型
      candidate-size: ${RAG_RETRIEVAL_RERANK_CANDIDATE_SIZE:20}     # RRF 后送 rerank 的候选数
      final-top-n: ${RAG_RETRIEVAL_RERANK_FINAL_TOP_N:}             # 精排后保留数（空=回退 final-top-n）
  agent:
    citation-top-n: ${RAG_AGENT_CITATION_TOP_N:5}   # Phase 7：终答引用裁剪上限。r07c/r07d 消融：top5 时 corr 43.75% 最优（更少引用=更少上下文噪声）
  embedding-dim: ${RAG_EMBEDDING_DIM:4096}
  data-dir: ${RAG_DATA_DIR:./data}
  min-chunk-size: 80
  memory:
    type: ${RAG_MEMORY_TYPE:memory}
  intent:
    enabled: ${RAG_INTENT_ENABLED:true}
    base-url: ${RAG_INTENT_BASE_URL:}
    model: ${RAG_INTENT_MODEL:}
    api-key: ${RAG_INTENT_API_KEY:}
    timeout-seconds: ${RAG_INTENT_TIMEOUT_SECONDS:5}
    confidence-threshold: ${RAG_INTENT_CONFIDENCE_THRESHOLD:0.6}
  vector:
    type: ${RAG_VECTOR_TYPE:qdrant}
    qdrant:
      host: ${RAG_VECTOR_QDRANT_HOST:localhost}
      port: ${RAG_VECTOR_QDRANT_PORT:6334}
      collection-prefix: ${RAG_VECTOR_QDRANT_COLLECTION_PREFIX:agentic_rag_chunks}
      hnsw-m: ${RAG_VECTOR_QDRANT_HNSW_M:16}
      ef-construct: ${RAG_VECTOR_QDRANT_EF_CONSTRUCT:100}
      search-ef: ${RAG_VECTOR_QDRANT_SEARCH_EF:100}

# LLM 配置（OpenAI 兼容接口）
# API Key 必须通过环境变量注入，禁止在仓库中保存真实密钥
llm:
  base-url: ${LLM_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${LLM_API_KEY}
  chat-model: ${LLM_CHAT_MODEL:zai-org/GLM-5.3}
  embedding-model: ${LLM_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  max-agent-rounds: 5
  memory-rounds: 10


mcp:
  enabled: ${MCP_ENABLED:false}
  server:
    url: ${MCP_SERVER_URL:}
    stdio:
      command: ${MCP_STDIO_COMMAND:}
      args: ${MCP_STDIO_ARGS:}

# 离线评测配置（跨 profile 生效：零依赖 eval profile 与真实栈默认 profile 共用）
eval:
  bench: ${EVAL_BENCH:internal}          # internal | enterpriserag
  enterprise-rag:
    corpus-dir: ${EVAL_ERAG_CORPUS:./data/enterpriserag-md}
    answers-path: ${EVAL_ERAG_ANSWERS:./eval-answers/answers.jsonl}
    report-path: ${EVAL_ERAG_REPORT:./enterpriserag-report.md}
    chat-mode: ${EVAL_ERAG_CHAT_MODE:rag}
    questions-path: ${EVAL_ERAG_QUESTIONS:}   # Phase 5 扰动集：外部题目 jsonl 路径，空=classpath 内置 64 题

logging:
  level:
    com.agenticrag: info
