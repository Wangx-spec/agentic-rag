services:
  app:
    build:
      context: .
    container_name: agentic-rag-app
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-zai-org/GLM-5.3}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentic_rag
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RAG_VECTOR_TYPE: qdrant
      RAG_VECTOR_QDRANT_HOST: qdrant
      RAG_VECTOR_QDRANT_PORT: 6334
      RAG_MEMORY_TYPE: redis
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    container_name: agentic-rag-postgres
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - agentic_rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - agentic_rag_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp || grep -q ':18BD' /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agentic-rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agentic_rag_pg_data:
  agentic_rag_qdrant_data:
